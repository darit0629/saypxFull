<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Digital Photo Book — SAYPX</title>
<link rel="stylesheet" href="/digital-album.css">
</head>
<body>

<div id="loadingScreen" class="da-loading">
  <div class="da-loading-logo">SAYPX</div>
  <div class="da-loading-text">Preparing your digital album…</div>
</div>

<div id="errorScreen" class="da-error" hidden>
  <div class="da-loading-logo">SAYPX</div>
  <p id="errorMessage" class="da-error-text">This digital album is currently unavailable.</p>
</div>

<div id="rotatePrompt" class="da-rotate-prompt" hidden>
  <div class="da-rotate-icon">
    <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="7" y="2" width="10" height="16" rx="2"></rect>
      <path d="M12 21v-3M9 20l3 1 3-1"></path>
    </svg>
  </div>
  <p>Turn your phone sideways</p>
  <p class="da-rotate-sub">For the best digital album experience, turn your phone sideways.</p>
</div>

<div id="viewerRoot" class="da-viewer" hidden>
  <div id="bookStage" class="da-book-stage">
    <div id="bookContainer" class="da-book"></div>
    <button id="openBookBtn" class="da-open-hint-btn">
      <span class="da-open-hint">Tap to open</span>
    </button>
  </div>
  <div class="da-cover-title" id="coverTitle"></div>

  <div id="controls" class="da-controls">
    <div class="da-controls-row">
      <button id="btnPrev" class="da-btn" aria-label="Previous page">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span id="pageCounter" class="da-page-counter">1 / 1</span>
      <button id="btnNext" class="da-btn" aria-label="Next page">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="da-controls-row">
      <button id="btnZoomOut" class="da-btn da-btn-sm" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6"/></svg>
      </button>
      <button id="btnZoomIn" class="da-btn da-btn-sm" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M11 8v6M8 11h6"/></svg>
      </button>
      <button id="btnSound" class="da-btn da-btn-sm" aria-label="Toggle sound">
        <svg id="soundOnIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19 9a5 5 0 010 6M22 6a9 9 0 010 12"/></svg>
        <svg id="soundOffIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" hidden><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>
      </button>
      <button id="btnFullscreen" class="da-btn da-btn-sm" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg>
      </button>
      <button id="btnTheme" class="da-btn da-btn-sm" aria-label="Toggle light/dark mode">
        <svg id="themeDarkIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg id="themeLightIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="btnShare" class="da-btn da-btn-sm" aria-label="Share">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
      <button id="btnExit" class="da-btn da-btn-sm" aria-label="Exit">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="shareSheet" class="da-share-sheet" hidden>
  <div class="da-share-card">
    <p class="da-share-title">Share this album</p>
    <button class="da-share-option" data-action="copy-link">Copy Link</button>
    <button class="da-share-option" data-action="copy-code">Copy Album Code</button>
    <button class="da-share-option" data-action="whatsapp">WhatsApp</button>
    <button class="da-share-option" data-action="email">Email</button>
    <button class="da-share-option da-share-cancel" data-action="close">Cancel</button>
  </div>
</div>

<script src="/vendor/page-flip.browser.js"></script>
<script src="/digital-album.js"></script>
</body>
</html>
